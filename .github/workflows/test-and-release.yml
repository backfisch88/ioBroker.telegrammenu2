name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - 'main'
    tags:
      # normal versions
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # pre-releases
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
# (matches ioBroker.example's reference format exactly, since the repo
# checker does a literal pattern match here, not a semantic one).
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to read-only; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Do not cancel the remaining matrix legs when one of them fails,
      # otherwise a single flaky OS/node combination hides all other results
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  # NOTE: npm publishing requires the package to exist on npmjs.com first
  # (npm publish or Trusted Publishing set up manually once), otherwise this
  # job fails - check-and-lint/adapter-tests are unaffected either way.
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Permissions:
    # - contents: write -> required to create GitHub releases
    # - id-token: write -> required for npm Trusted Publishing (OIDC)
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # npm-token intentionally omitted - using npm Trusted Publishing instead
          github-token: ${{ secrets.GITHUB_TOKEN }}
