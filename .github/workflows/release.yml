name: Create Release

# Runs automatically whenever a tag like "v0.1.1" is pushed - creates a
# matching GitHub Release so you don't have to click through the GitHub UI
# every time. Just: git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Uses the tag name as the release title, auto-generates release
          # notes from the commits since the last tag.
          generate_release_notes: true
